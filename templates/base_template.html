<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Crimson+Pro:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/report.css">
</head>
<body>
    <div class="page cover-page">
        <div class="page-content">
            <div class="cover-content">
                <div class="cover-logo">$company_name</div>
                <h1>$report_title</h1>
                <div class="subtitle">$subtitle</div>
                <div class="cover-meta">
                    <div class="prepared-for">Prepared for</div>
                    <div class="client-name">$client_name</div>
                    <div class="date">$date</div>
                </div>
            </div>
        </div>
    </div>
    <div class="page white-bg">
        <header class="page-header">
            <span class="logo-mark">$company_name</span>
            <span class="section-name">$section_name</span>
        </header>
        <div class="page-content">
            $content
        </div>
        <footer class="page-footer">
            <span class="logo-mark">$company_name</span>
            <span class="page-number">$page_number</span>
        </footer>
    </div>
</body>
</html>
